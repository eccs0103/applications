<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="generator" content="1.0.0">
	<meta name="title" content="Personal webpage">
	<meta name="author" content="eccs0103">
	<meta name="color-scheme" content="system">
	<meta name="description" content="Perfect two-way conversion between Telegram Android (.attheme) and Telegram Desktop (.tdesktop-theme) themes.">
	<meta name="keywords" content="telegram,theme,converter,attheme,tdesktop-theme">
	<meta name="robots" content="index, follow">
	<meta name="language" content="English">
	<meta name="revisit-after" content="1 days">
	<title>Telegram theme converter - Personal applications</title>
	<link rel="shortcut icon" href="../assets/icons/cake.png" media="(prefers-color-scheme: light)">
	<link rel="shortcut icon" href="../assets/icons/cake-inverted.png" media="(prefers-color-scheme: dark)">
	<link rel="stylesheet" href="../styles/global.css">
	<link rel="stylesheet" href="../styles/themes/material.css">
	<link rel="stylesheet" href="./view/style.css">
	<script type="module" src="../environment/services/analytics-service.ts"></script>
	<script type="module" src="./controllers/app-controller.ts"></script>
</head>

<body class="with-inline-padding with-block-padding with-inline-gap with-block-gap flex column">
	<h2>Telegram theme converter</h2>
	<p>Converts between Telegram Android (<code>.attheme</code>) and Telegram Desktop (<code>.tdesktop-theme</code>) themes, in either direction.</p>
	<section class="option">
		<label class="title" for="input-source">Source theme</label>
		<input class="value" id="input-source" type="file" accept=".attheme,.tdesktop-theme">
		<dfn class="definition" id="definition-source"></dfn>
	</section>
	<section class="option">
		<span class="title">Direction</span>
		<span class="value" id="span-direction"></span>
		<dfn class="definition" id="definition-direction">Detected automatically from the source file extension.</dfn>
	</section>
	<button id="button-convert" type="button" disabled>Convert</button>
	<hr class="layer">
	<div id="div-report" class="flex column with-block-gap" hidden>
		<h4>Coverage report</h4>
		<section class="option">
			<span class="title">Direct</span>
			<span class="value" id="span-report-direct"></span>
		</section>
		<section class="option">
			<span class="title">Anchored</span>
			<span class="value" id="span-report-anchored"></span>
		</section>
		<section class="option">
			<span class="title">Dropped</span>
			<span class="value" id="span-report-dropped"></span>
		</section>
		<details id="details-report-keys">
			<summary>Per-key breakdown</summary>
			<table id="table-report-keys"></table>
		</details>
	</div>
</body>

</html>
